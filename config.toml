title = "childrens sanctuary namibia"
baseURL = "https://childrenssanctuarynamibia.com/"
languageCode = "en-us"
theme = ["github.com/theNewDynamic/gohugo-theme-ananke"]
resourceDir = "../resources"

DefaultContentLanguage = "en"
SectionPagesMenu = "main"
Paginate = 5 # this is set low for demonstrating with dummy content. Set to a higher number
googleAnalytics = ""
enableRobotsTXT = true

[languages]
  [languages.en]
    title = "childrens sanctuary namibia"
    weight = 1
    contentDir = "content/en"
    # languageDirection = 'rtl' for Right-To-Left languages

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  text_color = ""
  author = ""
  favicon = ""
  site_logo = ""
  description = "A sanctuary where children experience love."
  # Name used only in search results and browser tabs (the visible site name is unchanged)
  seo_title = "Children's Sanctuary Namibia"
  # choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-orange"
  recent_posts_number = 3
  custom_css = ["_code.css","_hugo-internal-templates.css","_styles.css","_tachyons.css"]

[[params.ananke_socials]]
name = "youtube"
url = "https://youtube.com/@csndrimiopsis"
